name: Automated Production Deployment CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Frontend Dependencies & Test Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies & Validate FastApi
        run: |
          pip install -r requirements.txt
          python -c "import fastapi, tensorflow, supabase; print('[CI/CD]: All backend dependencies validated successfully!')"
