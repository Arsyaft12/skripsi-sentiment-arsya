<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08121E" />
      <stop offset="50%" stop-color="#0D2034" />
      <stop offset="100%" stop-color="#050B12" />
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F58529" />
      <stop offset="30%" stop-color="#DD2A7B" />
      <stop offset="70%" stop-color="#8134AF" />
      <stop offset="100%" stop-color="#515BD4" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <path d="M0 200 H800 M0 400 H800 M0 600 H800 M200 0 V800 M400 0 V800 M600 0 V800" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  
  <!-- Glowing Orbs -->
  <circle cx="400" cy="340" r="160" fill="url(#tealGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="180" r="100" fill="url(#igGrad)" opacity="0.2" filter="url(#glow)" />

  <!-- Instagram Badge Top Right -->
  <g transform="translate(660, 40)">
    <rect width="100" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="24" cy="18" r="7" fill="none" stroke="url(#igGrad)" stroke-width="2" />
    <rect x="17" y="11" width="14" height="14" rx="4" fill="none" stroke="url(#igGrad)" stroke-width="2" />
    <circle cx="27" cy="14" r="1.2" fill="#DD2A7B" />
    <text x="42" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">REEL</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(50, 50)">
    <rect width="210" height="36" rx="18" fill="rgba(45, 212, 191, 0.15)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#2DD4BF" />
    <text x="32" y="23" fill="#2DD4BF" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">CLINICAL EDUCATION</text>
  </g>

  <!-- Center Play Button & Icon -->
  <g transform="translate(400, 340)">
    <circle r="54" fill="rgba(15, 23, 42, 0.85)" stroke="url(#tealGrad)" stroke-width="2" />
    <circle r="64" fill="none" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1" stroke-dasharray="6 4" />
    <!-- Play Triangle -->
    <polygon points="-10,-18 20,0 -10,18" fill="url(#tealGrad)" />
  </g>

  <!-- Clinical Pulse Waveform -->
  <path d="M80 500 Q 200 500 280 500 L 320 460 L 350 540 L 390 430 L 430 550 L 460 480 L 490 500 L 720 500" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Post Title / Info Card Overlay at Bottom -->
  <g transform="translate(50, 560)">
    <rect width="700" height="190" rx="18" fill="rgba(13, 27, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Title -->
    <text x="30" y="42" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="bold">Clinical Practice &amp; Movement Rehabilitation</text>
    <text x="30" y="68" fill="#94A3B8" font-family="sans-serif" font-size="14">@zam_fisio • Zaez Abdul Mahdi, S.Ftr., Ftr., M.Ft., CMSKuS.</text>
    
    <!-- Separator -->
    <line x1="30" y1="88" x2="670" y2="88" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Metric Pills -->
    <g transform="translate(30, 106)">
      <rect width="190" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Fokus</text>
      <text x="16" y="44" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">Active Rehab</text>
    </g>

    <g transform="translate(235, 106)">
      <rect width="200" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Metode</text>
      <text x="16" y="44" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="bold">Evidence-Based</text>
    </g>

    <g transform="translate(450, 106)">
      <rect width="220" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="24" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Platform</text>
      <text x="16" y="44" fill="#E879F9" font-family="sans-serif" font-size="14" font-weight="bold">Instagram Reel ↗</text>
    </g>
  </g>
</svg>