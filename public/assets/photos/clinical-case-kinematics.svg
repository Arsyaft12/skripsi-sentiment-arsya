<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="gKin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#gKin)" />
  <circle cx="300" cy="300" r="180" fill="#06b6d4" fill-opacity="0.08" />
  
  <!-- Biomechanical Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="100" x2="500" y2="100" />
    <line x1="100" y1="200" x2="500" y2="200" />
    <line x1="100" y1="300" x2="500" y2="300" />
    <line x1="100" y1="400" x2="500" y2="400" />
    <line x1="100" y1="500" x2="500" y2="500" />
    <line x1="200" y1="80" x2="200" y2="520" />
    <line x1="300" y1="80" x2="300" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" />
  </g>

  <!-- Kinematic Stick / Joint Model Graphic -->
  <g stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Head -->
    <circle cx="300" cy="160" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <!-- Spine -->
    <line x1="300" y1="184" x2="300" y2="300" />
    <!-- Arms -->
    <line x1="300" y1="210" x2="230" y2="260" />
    <line x1="230" y1="260" x2="190" y2="220" />
    <line x1="300" y1="210" x2="370" y2="250" />
    <line x1="370" y1="250" x2="420" y2="290" />
    <!-- Legs (Squat / Movement analysis) -->
    <line x1="300" y1="300" x2="240" y2="380" />
    <line x1="240" y1="380" x2="220" y2="470" />
    <line x1="300" y1="300" x2="360" y2="370" />
    <line x1="360" y1="370" x2="390" y2="465" />
  </g>

  <!-- Joint Markers -->
  <circle cx="230" cy="260" r="6" fill="#06b6d4" />
  <circle cx="370" cy="250" r="6" fill="#06b6d4" />
  <circle cx="240" cy="380" r="7" fill="#f43f5e" />
  <circle cx="360" cy="370" r="7" fill="#10b981" />
  <circle cx="220" cy="470" r="6" fill="#38bdf8" />
  <circle cx="390" cy="465" r="6" fill="#38bdf8" />

  <!-- Angle Data Overlay -->
  <rect x="230" y="340" width="70" height="24" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
  <text x="265" y="356" font-family="monospace" font-size="11" font-weight="bold" fill="#f43f5e" text-anchor="middle">∠ 118°</text>

  <rect x="350" y="330" width="70" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="385" y="346" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">∠ 124°</text>

  <!-- Title & Card Details -->
  <rect x="30" y="580" width="540" height="180" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <text x="60" y="625" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="2">ANALISIS KINEMATIK &amp; SKRINING GERAK</text>
  <text x="60" y="660" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Biomechanical Movement Screen</text>
  <text x="60" y="695" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Evaluasi sudut sendi, beban progresif &amp; pola gerak fungsional.</text>
  <text x="60" y="730" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">✓ Return to Sport Protocol (RTS)</text>
</svg>
